name: Verify ftscr

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node dist/cli.js generate --input fixtures/source.json --output output/matches.json
      - uses: actions/upload-artifact@v7
        with:
          name: ftscr-paris-2024
          path: output/matches.json
          if-no-files-found: error
